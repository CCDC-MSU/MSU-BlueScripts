---
# Configure systemd journald

- name: Create journald configuration directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Deploy CCDC journald configuration
  template:
    src: journald-ccdc.conf.j2
    dest: /etc/systemd/journald.conf.d/ccdc.conf
    mode: '0644'
  notify: restart journald

- name: Ensure persistent journal storage directory exists
  file:
    path: /var/log/journal
    state: directory
    mode: '2755'
    owner: root
    group: systemd-journal
  failed_when: false
